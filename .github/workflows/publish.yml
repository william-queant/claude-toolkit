name: Publish to npm

# Publishes the package when a GitHub Release is published, or when this workflow
# is re-run by hand on a release tag (Actions -> Publish to npm -> Run workflow ->
# pick the tag, e.g. v0.17.0-rc.0).
#
# Auth is npm trusted publishing (OIDC): no token secret, provenance is automatic.
# One-time setup on npmjs.com -> claude-toolkit -> Settings -> Trusted Publisher:
# GitHub Actions, repository william-queant/claude-toolkit, workflow publish.yml.
#
# A version containing "-" (e.g. 0.17.0-rc.0) publishes to the "next" dist-tag;
# any other version publishes to "latest".

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Use an npm that supports trusted publishing (>= 11.5.1)
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          HUSKY: "0"

      - name: Verify package version matches the tag and pick the dist-tag
        id: meta
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi
          case "$PKG_VERSION" in
            *-*) echo "dist_tag=next" >> "$GITHUB_OUTPUT" ;;
            *) echo "dist_tag=latest" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Typecheck, lint, test
        run: bun run typecheck && bun run lint:check && bun test

      - name: Drop the dev-only prepare script from the published manifest
        run: npm pkg delete scripts.prepare

      - name: Tarball guard
        run: bun run check:pack --publish

      - name: Install smoke test
        run: bun run check:smoke

      - name: Publish to npm
        run: npm publish --access public --tag "${{ steps.meta.outputs.dist_tag }}"
        env:
          HUSKY: "0"
