name: CI

# Typecheck, lint, test and the tarball guard on every push and pull request.

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          HUSKY: "0"

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint:check

      - name: Test
        run: bun test

      - name: Tarball guard
        run: bun run check:pack

      # Also run the install smoke test here, so a Linux-only failure (bin permissions,
      # `bun add` of a tarball) shows up on the PR, not after a release tag is used up.
      - name: Install smoke test
        run: bun run check:smoke
